[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyslug"
version = "0.1.0"
description = "Turns text into URL slugs. A demo project for testing the ThePolisher GitHub Action."
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest"]
